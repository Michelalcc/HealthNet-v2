<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes — HealthNet v2</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/themes.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    .paciente-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: 10px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.07);
      margin-bottom: 8px; transition: background .2s;
    }
    .paciente-item:hover { background: rgba(255,255,255,.08); }
    .pac-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      object-fit: cover; object-position: center;
      border: 2px solid rgba(255,255,255,.1); flex-shrink: 0;
    }
    .pac-info { flex: 1; min-width: 0; }
    .pac-info strong {
      font-size: 13px; display: block; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pac-info small { font-size: 11px; opacity: .5; }
    .btn-diag {
      padding: 7px 13px; font-size: 12px; border-radius: 8px;
      background: var(--primary-color); color: white; border: none;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      display: flex; align-items: center; gap: 5px; transition: opacity .2s;
    }
    .btn-diag:hover { opacity: .8; }
    #hospitalFieldWrap { display: none; }
    .msg-box { margin-top: 10px; font-size: 13px; padding: 10px 14px; border-radius: 8px; display: none; }
    .msg-ok  { background: rgba(34,197,94,.1);  color: #4ade80; border: 1px solid rgba(34,197,94,.25); }
    .msg-err { background: rgba(239,68,68,.1);   color: #f87171; border: 1px solid rgba(239,68,68,.25); }
    .empty-p { opacity: .4; font-size: 13px; text-align: center; padding: 24px 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>

  <header class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()"><i class="ti ti-menu-2"></i></button>
    <div style="display:flex;align-items:center;gap:12px;">
      <h2 style="font-size:18px;font-weight:500;margin:0;">Gestión de Pacientes</h2>
      <span id="hospitalBadge" class="hospital-badge"></span>
    </div>
    <div class="topbar-user">
      <img id="topAvatar" src="" alt="avatar" width="38" height="38" style="border-radius:50%;object-fit:cover;">
      <div>
        <p id="topUserName" style="margin:0;font-size:13px;font-weight:500;"></p>
        <small id="topUserRole" style="opacity:.6;font-size:11px;"></small>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="grid grid-2">

      <!-- ── REGISTRAR ── -->
      <div class="card">
        <h3><i class="ti ti-user-plus" style="margin-right:6px;"></i>Registrar paciente</h3>

        <!-- Selector hospital: solo visible para admin, carga desde API (incluye nuevos hospitales) -->
        <div id="hospitalFieldWrap">
          <label>Hospital <span style="color:#f87171;font-size:11px;">*</span></label>
          <select id="pHospital">
            <option value="">— Selecciona un hospital —</option>
          </select>
        </div>

        <label>Nombre completo</label>
        <input type="text" id="pNombre" placeholder="Ej: Juan Pérez García">

        <label>DNI</label>
        <input type="text" id="pDni" placeholder="8 dígitos" maxlength="8"
               oninput="this.value=this.value.replace(/\D/g,'')">

        <label>Edad</label>
        <input type="number" id="pEdad" placeholder="Ej: 35" min="1" max="120">

        <label>Sexo</label>
        <select id="pSexo">
          <option value="Masculino">Masculino</option>
          <option value="Femenino">Femenino</option>
        </select>

        <button onclick="crearPaciente()" style="width:100%;margin-top:6px;">
          <i class="ti ti-check" style="margin-right:6px;"></i>Registrar paciente
        </button>
        <div id="formMsg" class="msg-box"></div>
      </div>

      <!-- ── LISTA ── -->
      <div class="card">
        <h3><i class="ti ti-users" style="margin-right:6px;"></i>Pacientes del hospital</h3>
        <input type="text" id="buscarInput"
               placeholder="Buscar por nombre o DNI..."
               oninput="filtrarPacientes()"
               style="margin-bottom:12px;">
        <p id="contadorPac" style="font-size:12px;opacity:.35;margin-bottom:8px;"></p>
        <div id="listaPacientes" style="max-height:450px;overflow-y:auto;padding-right:4px;">
          <p class="empty-p">
            <i class="ti ti-loader" style="animation:spin .8s linear infinite;font-size:24px;display:block;margin-bottom:8px;"></i>
            Cargando pacientes...
          </p>
        </div>
      </div>

    </div>
  </main>

  <script src="../scripts/core/session.js"></script>
  <script src="../scripts/core/router.js"></script>
  <script src="../scripts/core/api.js"></script>
  <script src="../scripts/core/theme.js"></script>
  <script src="../scripts/ui/layout.js"></script>
  <script src="../scripts/ui/sidebar.js"></script>

  <script>
    const AVH = "../assets/images/pacientes/paciente_hombre.png";
    const AVM = "../assets/images/pacientes/paciente_mujer.png";
    let todos = [];

    document.addEventListener("DOMContentLoaded", async () => {
      routeGuard();
      initLayout();

      const user = getUser();
      if (user?.rol === "admin") {
        document.getElementById("hospitalFieldWrap").style.display = "block";
        await cargarHospitalesSelect();  // carga todos los hospitales desde la BD
      }

      cargarPacientes();
    });

    /* ══════════════════════════════════
       CARGAR HOSPITALES EN SELECT
       Trae TODOS desde /api/hospitals,
       incluyendo los que se agreguen nuevos
    ══════════════════════════════════ */
    async function cargarHospitalesSelect() {
      const sel = document.getElementById("pHospital");
      try {
        const data = await api.get("/hospitals");
        const lista = data?.data || [];
        if (!lista.length) {
          sel.innerHTML = `<option value="">Sin hospitales registrados</option>`;
          return;
        }
        sel.innerHTML = `<option value="">— Selecciona un hospital —</option>` +
          lista.map(h => `<option value="${h.id}">${h.nombre}</option>`).join("");
      } catch (e) {
        sel.innerHTML = `<option value="">Error al cargar hospitales</option>`;
      }
    }

    /* ══════════════════════════════════
       CARGAR PACIENTES
    ══════════════════════════════════ */
    async function cargarPacientes() {
      try {
        const data = await api.get("/pacientes");
        todos = data?.data || [];
        renderLista(todos);
      } catch (e) {
        document.getElementById("listaPacientes").innerHTML =
          `<p style="color:#f87171;font-size:13px;"><i class="ti ti-alert-circle"></i> ${e.message}</p>`;
      }
    }

    /* ══════════════════════════════════
       RENDER LISTA
    ══════════════════════════════════ */
    function renderLista(lista) {
      const el = document.getElementById("listaPacientes");
      document.getElementById("contadorPac").textContent =
        lista.length ? `${lista.length} paciente${lista.length !== 1 ? "s" : ""}` : "";

      if (!lista.length) {
        el.innerHTML = `<p class="empty-p"><i class="ti ti-users-group" style="font-size:28px;display:block;margin-bottom:8px;"></i>Sin pacientes registrados.</p>`;
        return;
      }

      el.innerHTML = lista.map(p => {
        const esFem  = p.sexo === "Femenino" || p.sexo === "F";
        const avatar = esFem ? AVM : AVH;
        const sexoL  = esFem ? "Femenino" : "Masculino";
        // Serializar para onclick sin romper el HTML
        const pStr = encodeURIComponent(JSON.stringify(p));
        return `
          <div class="paciente-item">
            <img class="pac-avatar" src="${avatar}" alt="${p.nombre}">
            <div class="pac-info">
              <strong>${p.nombre}</strong>
              <small>DNI: ${p.dni} &nbsp;·&nbsp; ${p.edad} años &nbsp;·&nbsp; ${sexoL}</small>
            </div>
            <button class="btn-diag" onclick="irADiagnostico('${pStr}')">
              <i class="ti ti-brain"></i>Diagnosticar
            </button>
          </div>`;
      }).join("");
    }

    /* ══════════════════════════════════
       FILTRAR
    ══════════════════════════════════ */
    function filtrarPacientes() {
      const q = document.getElementById("buscarInput").value.toLowerCase();
      renderLista(todos.filter(p =>
        p.nombre.toLowerCase().includes(q) || String(p.dni).includes(q)
      ));
    }

    /* ══════════════════════════════════
       IR A DIAGNÓSTICO
    ══════════════════════════════════ */
    function irADiagnostico(pStr) {
      const paciente = JSON.parse(decodeURIComponent(pStr));
      localStorage.setItem("pacienteActivo", JSON.stringify(paciente));
      window.location.href = "diagnostico.html";
    }

    /* ══════════════════════════════════
       CREAR PACIENTE
    ══════════════════════════════════ */
    async function crearPaciente() {
      const nombre = document.getElementById("pNombre").value.trim();
      const dni    = document.getElementById("pDni").value.trim();
      const edad   = document.getElementById("pEdad").value.trim();
      const sexo   = document.getElementById("pSexo").value;
      const msg    = document.getElementById("formMsg");

      msg.style.display = "none";

      if (!nombre || !dni || !edad) { showMsg(msg, "err", "Completa todos los campos"); return; }
      if (!/^\d{8}$/.test(dni))     { showMsg(msg, "err", "El DNI debe tener 8 dígitos"); return; }
      if (+edad < 1 || +edad > 120) { showMsg(msg, "err", "Edad debe ser entre 1 y 120"); return; }

      const user = getUser();
      const body = { nombre, dni, edad: +edad, sexo };

      if (user?.rol === "admin") {
        const hid = document.getElementById("pHospital").value;
        if (!hid) { showMsg(msg, "err", "Selecciona un hospital"); return; }
        body.hospital_id = +hid;
      }

      try {
        await api.post("/pacientes", body);
        showMsg(msg, "ok", "✓ Paciente registrado correctamente");
        ["pNombre","pDni","pEdad"].forEach(id => document.getElementById(id).value = "");
        await cargarPacientes();
        setTimeout(() => { msg.style.display = "none"; }, 3500);
      } catch (e) {
        showMsg(msg, "err", e.message || "Error al registrar");
      }
    }

    function showMsg(el, tipo, texto) {
      el.textContent = texto;
      el.className   = `msg-box msg-${tipo}`;
      el.style.display = "block";
    }
  </script>
</body>
</html>
